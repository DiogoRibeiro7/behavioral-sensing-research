name: Install frozen cohort artifact

on:
  push:
    branches:
      - freeze/v03-primary-external-cohort

permissions:
  contents: write
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download frozen artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/DiogoRibeiro7/behavioral-sensing-research/actions/artifacts/9770672773/zip \
            --output /tmp/freeze.zip
          mkdir freeze-artifact
          unzip /tmp/freeze.zip -d freeze-artifact
      - name: Verify exact artifact
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          src = Path('freeze-artifact/external_cohort_manifest.json')
          dec = Path('freeze-artifact/external_cohort_freeze_declaration.json')
          sha = hashlib.sha256(src.read_bytes()).hexdigest()
          payload = json.loads(src.read_text())
          declaration = json.loads(dec.read_text())
          assert sha == '6e3e157327c6eb40edfae498c2c4cc679a9e7c5b999899cf31683ed8161bc332'
          assert declaration['manifest_sha256'] == sha
          assert payload['eligible_count'] == 43
          assert payload['status'] == 'frozen-primary-external-cohort'
          assert payload['scored'] is False
          assert payload['freeze']['raw_identity_match'] is True
          assert payload['freeze']['primary_test_outcomes_inspected'] is False
          PY
      - name: Commit exact frozen files
        run: |
          cp freeze-artifact/external_cohort_manifest.json artifacts/v03/external_cohort_manifest.json
          cp freeze-artifact/external_cohort_freeze_declaration.json artifacts/v03/external_cohort_freeze_declaration.json
          git rm .github/workflows/install-v03-cohort-freeze-once.yml
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          git add artifacts/v03/external_cohort_manifest.json artifacts/v03/external_cohort_freeze_declaration.json
          git commit -m "research: freeze primary v0.3 external cohort"
          git push origin HEAD:freeze/v03-primary-external-cohort
