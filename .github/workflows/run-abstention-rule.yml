name: Run the abstention-rule selection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-abstention-rule
  cancel-in-progress: false

jobs:
  run:
    name: score the frozen protocol on the development panel, once
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # One thread each, so the sums EM and the recursion take run in one order.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - name: Require manual develop dispatch
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/develop"

      # The whole history, to see the frozen protocol's commits.
      - name: Check out the frozen revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse a frozen protocol changed after its freeze
        shell: bash
        run: |
          commits=$(git log --format=%H -- artifacts/phase4/abstention_protocol.json | wc -l)
          if [ "$commits" != "1" ]; then
            echo "the frozen protocol has $commits commits; it may have only the freeze"
            exit 1
          fi

      # The versions the combined-prior record, which the run must reproduce,
      # was made with.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "numpy==2.3.5" "pandas==2.3.3" "scipy==1.15.3"

      - name: Refuse a second run
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin run-artifacts/phase4-abstention-rule; then
            echo "run-artifacts/phase4-abstention-rule exists: the experiment has been run"
            exit 1
          fi

      - name: Describe the runner's CPU
        shell: bash
        run: |
          grep -m1 "model name" /proc/cpuinfo
          if grep -qw avx512f /proc/cpuinfo; then echo "AVX-512: yes"; else echo "AVX-512: no"; fi

      # The verified archive is kept in this repository's Actions cache, keyed by
      # its published checksum, so a run need not wait on Zenodo. A restored
      # archive is still checked against the checksum Zenodo publishes.
      - name: Restore the CASAS archive from the cache
        id: casas-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/casas/labeled_data.zip
          key: casas-labeled-data-md5-ec37d679e85a6ae39e84994888afd514

      - name: Download and verify public CASAS archive
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          # Outside the checkout, so the working tree stays clean for the record.
          mkdir -p "$RUNNER_TEMP/casas"
          python - <<'PY'
          import os
          import hashlib
          import json
          import subprocess
          import urllib.request
          from pathlib import Path

          # A dropped or stalled connection, under 1 KB/s for a minute, is retried
          # and resumed where it stopped; the checksum below decides whether the
          # file is the published one.
          def fetch(url, target):
              subprocess.run(
                  ["curl", "-fsSL", "--retry", "8", "--retry-delay", "15",
                   "--retry-all-errors", "--connect-timeout", "30",
                   "--speed-limit", "1024", "--speed-time", "60",
                   "-C", "-", "-o", str(target), url],
                  check=True,
              )

          record = "15708568"
          request = urllib.request.Request(
              f"https://zenodo.org/api/records/{record}",
              headers={"User-Agent": "behavioral-sensing-research workflow"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              meta = json.load(response)
          candidates = [f for f in meta.get("files", []) if f.get("key") == "labeled_data.zip"]
          if len(candidates) != 1:
              raise SystemExit(f"expected one labeled_data.zip, got {len(candidates)}")
          item = candidates[0]
          target = Path(os.environ["RUNNER_TEMP"]) / "casas" / "labeled_data.zip"
          if target.exists():
              print("restored from the cache; verifying")
          else:
              fetch(item["links"]["self"], target)
          algorithm, expected = item["checksum"].split(":", 1)
          digest = hashlib.new(algorithm)
          with target.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          if digest.hexdigest() != expected:
              raise SystemExit(f"archive checksum mismatch: {digest.hexdigest()} != {expected}")
          PY
          unzip -q "$RUNNER_TEMP/casas/labeled_data.zip" -d "$RUNNER_TEMP/casas/extracted"

      - name: Keep the verified CASAS archive in the cache
        if: steps.casas-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/casas/labeled_data.zip
          key: casas-labeled-data-md5-ec37d679e85a6ae39e84994888afd514

      - name: Run the frozen protocol
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          python scripts/run_abstention_rule.py \
            "$RUNNER_TEMP/casas/extracted" "$RUNNER_TEMP/abstention"

      # A record written is the run, whatever failed after it.
      - name: Commit the outputs to a results branch
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/abstention/phase4-abstention-rule.json" ]; then
            echo "no record was written: nothing to commit"
            exit 0
          fi
          branch="run-artifacts/phase4-abstention-rule"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          mkdir -p "$branch"
          cp -r "$RUNNER_TEMP/abstention/." "$branch/"
          git add "$branch"
          git commit -m "run artifact $GITHUB_RUN_ID"
          git push origin "$branch"

      - name: Upload the outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase4-abstention-rule
          path: ${{ runner.temp }}/abstention/
          retention-days: 90
          if-no-files-found: error
