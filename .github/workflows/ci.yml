name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      paper_only: ${{ steps.classify.outputs.paper_only }}
      paper_python: ${{ steps.classify.outputs.paper_python }}
      full_repo: ${{ steps.classify.outputs.full_repo }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      metadata_only: ${{ steps.classify.outputs.metadata_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "paper_only=false" >> "$GITHUB_OUTPUT"
            echo "paper_python=false" >> "$GITHUB_OUTPUT"
            echo "full_repo=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "metadata_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if (( ${#files[@]} == 0 )); then
            echo "paper_only=false" >> "$GITHUB_OUTPUT"
            echo "paper_python=false" >> "$GITHUB_OUTPUT"
            echo "full_repo=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "metadata_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          paper_only=true
          paper_python=false
          docs_only=true
          metadata_only=true
          for file in "${files[@]}"; do
            if [[ "$file" != papers/* ]]; then
              paper_only=false
            fi
            if [[ "$file" == papers/*.py || "$file" == papers/**/*.py ]]; then
              paper_python=true
            fi
            case "$file" in
              docs/*.md|mkdocs.yml|CHANGELOG.md|ROADMAP.md|RELEASE.md|ZENODO.md) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              CITATION.cff|.zenodo.json|CHANGELOG.md|ZENODO.md|RELEASE.md) ;;
              *) metadata_only=false ;;
            esac
          done

          echo "paper_only=$paper_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "paper_python=$paper_python" >> "$GITHUB_OUTPUT"
          echo "metadata_only=$metadata_only" >> "$GITHUB_OUTPUT"
          if [[ "$paper_only" == "true" || "$metadata_only" == "true" ]]; then
            echo "full_repo=false" >> "$GITHUB_OUTPUT"
          else
            echo "full_repo=true" >> "$GITHUB_OUTPUT"
          fi

  metadata:
    name: metadata checks
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.metadata_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install metadata test dependencies
        run: pip install pytest pyyaml
      - name: Run release metadata tests
        run: pytest -q -o addopts='' --noconftest tests/test_project_metadata.py

  paper:
    name: paper checks
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.paper_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whitespace and patch integrity
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Validate paper JSON files
        shell: bash
        run: |
          while IFS= read -r file; do
            python -m json.tool "$file" >/dev/null
          done < <(find papers -type f -name '*.json' -print)
      - name: Set up Python
        if: needs.changes.outputs.paper_python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install paper formatters
        if: needs.changes.outputs.paper_python == 'true'
        run: pip install 'ruff==0.11.13' 'black==23.9.1'
      - name: Check paper Python
        if: needs.changes.outputs.paper_python == 'true'
        shell: bash
        run: |
          mapfile -t files < <(find papers -type f -name '*.py' -print)
          python -m py_compile "${files[@]}"
          ruff check "${files[@]}"
          black --check --line-length=88 "${files[@]}"

  lint:
    needs: changes
    if: needs.changes.outputs.full_repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
      - name: Run pre-commit on changed files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
      - name: Run pre-commit on all files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          pre-commit run --all-files

  test:
    needs: changes
    if: >-
      needs.changes.outputs.full_repo == 'true'
      && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: fast tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
      - name: Run fast regression suite
        run: |
          pytest --cov=sensor_modeling --cov-report=xml --cov-report=term \
            --ignore=tests/performance \
            --ignore=tests/test_adversarial.py \
            --ignore=tests/test_attribution_study.py \
            --ignore=tests/test_detection_study.py \
            --ignore=tests/test_fusion_calibration.py \
            --ignore=tests/test_online_pipeline.py \
            --ignore=tests/test_replicated_attribution.py \
            --ignore=tests/test_simulation.py

  slow:
    name: slow regression (py3.14)
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      && needs.changes.outputs.full_repo == 'true'
      && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
      - name: Run slow research and performance regression
        run: |
          pytest -q \
            tests/performance \
            tests/test_adversarial.py \
            tests/test_attribution_study.py \
            tests/test_detection_study.py \
            tests/test_fusion_calibration.py \
            tests/test_online_pipeline.py \
            tests/test_replicated_attribution.py \
            tests/test_simulation.py

  docs:
    needs: changes
    if: needs.changes.outputs.full_repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[docs]
      - name: Build documentation
        run: |
          mkdocs build --strict
      - name: Upload built documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: site/
          retention-days: 7
      - name: Check links
        continue-on-error: true
        run: |
          pip install linkchecker
          linkchecker --no-warnings --ignore-url='^(?!file://)' site/index.html

  package:
    needs: changes
    if: needs.changes.outputs.full_repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install build tooling
        run: |
          pip install --upgrade pip
          pip install build twine
      - name: Build package artifacts
        run: |
          python -m build
      - name: Check package artifacts
        run: |
          python -m twine check dist/*

  gate:
    name: all checks passed
    runs-on: ubuntu-latest
    needs: [changes, metadata, paper, lint, test, slow, docs, package]
    if: always()
    steps:
      - name: Verify required checks for this change class
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::change classification failed"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.metadata_only }}" == "true" ]]; then
            echo "metadata -> ${{ needs.metadata.result }}"
            [[ "${{ needs.metadata.result }}" == "success" ]] || exit 1
            exit 0
          fi

          if [[ "${{ needs.changes.outputs.paper_only }}" == "true" ]]; then
            echo "paper -> ${{ needs.paper.result }}"
            [[ "${{ needs.paper.result }}" == "success" ]] || exit 1
            exit 0
          fi

          docs_only="${{ needs.changes.outputs.docs_only }}"
          echo "docs_only -> $docs_only"
          echo "lint ${{ needs.lint.result }}  test ${{ needs.test.result }}"
          echo "slow ${{ needs.slow.result }}  docs ${{ needs.docs.result }}  package ${{ needs.package.result }}"

          required="lint docs package"
          if [[ "$docs_only" != "true" || "${{ needs.test.result }}" != "skipped" ]]; then
            required="$required test"
          fi
          if [[ "${{ github.event_name }}" != "pull_request" && "$docs_only" != "true" ]]; then
            required="$required slow"
          fi

          for job in $required; do
            case "$job" in
              lint) result="${{ needs.lint.result }}" ;;
              test) result="${{ needs.test.result }}" ;;
              slow) result="${{ needs.slow.result }}" ;;
              docs) result="${{ needs.docs.result }}" ;;
              package) result="${{ needs.package.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "::error::required job $job did not succeed ($result)"
              exit 1
            fi
          done
