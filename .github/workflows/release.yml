name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, for example 0.5.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Run the release workflow from main, not ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install metadata test dependencies
        run: pip install pytest pyyaml

      - name: Validate release metadata
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH without a v prefix"
            exit 1
          fi
          pytest -q --noconftest tests/test_project_metadata.py
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import yaml

          version = os.environ["VERSION"]
          root = Path(".")
          pyproject = (root / "pyproject.toml").read_text(encoding="utf-8")
          package_init = (root / "sensor_modeling/__init__.py").read_text(encoding="utf-8")
          citation = yaml.safe_load((root / "CITATION.cff").read_text(encoding="utf-8"))
          zenodo = json.loads((root / ".zenodo.json").read_text(encoding="utf-8"))
          readme = (root / "README.md").read_text(encoding="utf-8")
          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")

          versions = {
              "pyproject": re.search(r'^version = "([^"]+)"', pyproject, re.MULTILINE).group(1),
              "package": re.search(r'__version__ = "([^"]+)"', package_init, re.MULTILINE).group(1),
              "citation": str(citation["version"]),
              "zenodo": str(zenodo["version"]),
              "readme": re.search(r"version=\{([^}]+)\}", readme).group(1),
          }
          wrong = {name: value for name, value in versions.items() if value != version}
          if wrong:
              raise SystemExit(f"metadata versions do not match {version}: {wrong}")

          if not re.search(rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}$", changelog, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md has no dated [{version}] release section")
          PY

      - name: Extract changelog release notes
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$\n(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"release section {version} not found")
          Path("release-notes.md").write_text(match.group("body").strip() + "\n", encoding="utf-8")
          PY

      - name: Create or verify annotated tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          target="$(git rev-parse HEAD)"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing="$(git rev-list -n 1 "$tag")"
            if [[ "$existing" != "$target" ]]; then
              echo "::error::$tag already points to $existing, expected $target"
              exit 1
            fi
            echo "$tag already points to the exact main commit; reusing it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$target" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          target="$(git rev-parse HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::GitHub Release $tag already exists"
            exit 1
          fi
          gh release create "$tag" \
            --target "$target" \
            --title "$tag" \
            --notes-file release-notes.md
