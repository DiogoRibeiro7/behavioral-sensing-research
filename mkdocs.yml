site_name: Sensor Modeling Research Toolkit
site_description: >-
  Interpretable, probabilistic, privacy-preserving multimodal ambient sensing
  for behavioural research.
site_url: https://sensor-modeling.readthedocs.io
repo_url: https://github.com/DiogoRibeiro7/behavioral-sensing-research
repo_name: DiogoRibeiro7/behavioral-sensing-research
edit_uri: edit/develop/docs/
copyright: Copyright &copy; Diogo Ribeiro. MIT licensed.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    # The docs contain tables that must stay legible in both schemes, so both
    # are defined rather than pinning one.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Usage examples: usage.md
      - Ingesting sensors: multimodal_ingestion.md
      - Quickstart notebook: tutorials/quickstart.ipynb
  - Ambient sensing:
      - Architecture: ambient_architecture.md
      - Inference: inference.md
      - Evaluation: evaluation.md
      - Limitations: limitations.md
      - Real-data validation: real_data.md
  - Design records:
      - Multimodal architecture: MULTIMODAL_ARCHITECTURE.md
      - Research questions: RESEARCH_QUESTIONS.md
      - Sensor data model: SENSOR_DATA_MODEL.md
      - Uncertainty model: UNCERTAINTY_MODEL.md
      - Evaluation design: EVALUATION_DESIGN.md
      - Information-set contract: INFORMATION_SETS.md
      - Matched evaluation: MATCHED_EVALUATION.md
      - Inference regimes: INFERENCE_REGIMES.md
      - Baseline models: BASELINES.md
      - "Phase 1: matched baselines": PHASE1_MATCHED_BASELINES.md
      - "Phase 1: recoverable-information gap": PHASE1_RECOVERABLE_GAP.md
      - Periodic state prior: PERIODIC_STATE_PRIOR.md
      - "Phase 3.1: hierarchical time prior": PHASE3_TIME_PRIOR.md
      - Recent-history state: HISTORY_STATE.md
      - "Phase 3.2: explicit history state": PHASE3_HISTORY_STATE.md
      - "Phase 3.3: correlated silence": PHASE3_CORRELATED_SILENCE.md
      - "Phase 3.3 follow-up: fitted rates": PHASE3_FITTED_RATES.md
      - "Phase 3.3 follow-up: predictive checks": PHASE3_PREDICTIVE_CHECKS.md
      - Hurdle negative binomial: HURDLE_NEGATIVE_BINOMIAL.md
      - "Phase 3.3 follow-up: negative binomial": PHASE3_NEGATIVE_BINOMIAL.md
      - Partial pooling: PARTIAL_POOLING.md
      - "Phase 3.4: partial pooling": PHASE3_PARTIAL_POOLING.md
      - "Phase 3.5: fixed-lag smoothing": PHASE3_SMOOTHING.md
      - Structural disagreement: STRUCTURAL_DISAGREEMENT.md
      - Evidence-group disagreement: EVIDENCE_GROUP_DISAGREEMENT.md
      - Observation mismatch: OBSERVATION_MISMATCH.md
      - Selective prediction: SELECTIVE_PREDICTION.md
      - "Phase 4: uncertainty diagnostics": PHASE4_UNCERTAINTY_DIAGNOSTICS.md
      - Experiment artifacts: EXPERIMENT_ARTIFACTS.md
      - Simulation protocols: SIMULATION_PROTOCOLS.md
      - v0.3 candidate specification: V03_CANDIDATE_SPECIFICATION.md
      - v0.3 freeze verification: V03_PROFILE_FREEZE_VERIFICATION.md
      - External cohort composition: EXTERNAL_COHORT_COMPOSITION.md
      - Adversarial review: ADVERSARIAL_REVIEW.md
      - Release readiness: RELEASE_READINESS.md
  - Modelling core:
      - Overview: architecture.md
      - Mathematical background: background.md
      - Module guides: modules.md
      - Clinical examples: clinical_examples.md
  - Reference:
      - API: api.md
      - Roadmap: roadmap.md
      - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: numpy
            members_order: source
            filters:
              - "!^_"

watch:
  - sensor_modeling

strict: true
